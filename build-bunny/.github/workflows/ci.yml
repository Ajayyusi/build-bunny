name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://bunny:bunny@localhost:5432/bunny_dev
  TEST_DATABASE_URL: postgresql://bunny:bunny@localhost:5432/bunny_test
  BETTER_AUTH_SECRET: ci-only-secret-not-for-production
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bunny
          POSTGRES_PASSWORD: bunny
          POSTGRES_DB: bunny_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bunny -d bunny_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Tests run against a separate database so migrate/seed state in
      # bunny_dev never leaks into assertions.
      - name: Create test database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE bunny_test;'

      - name: Apply migrations (dev DB)
        run: npx prisma migrate deploy

      - name: Apply migrations (test DB)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
