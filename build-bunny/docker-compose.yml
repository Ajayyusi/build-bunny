services:
  db:
    image: postgres:16-alpine
    container_name: buildbunny-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bunny
      POSTGRES_PASSWORD: bunny
      POSTGRES_DB: bunny_dev
    ports:
      - "5432:5432"
    volumes:
      - buildbunny-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bunny -d bunny_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  buildbunny-pgdata:
