name: CI

on:
  push:
    branches: [main]
  pull_request:

# The application lives in build-bunny/ (repo root is the Nitaq workspace);
# every run step executes from there.
defaults:
  run:
    working-directory: build-bunny

env:
  DATABASE_URL: postgresql://bunny:bunny@localhost:5432/bunny_dev
  TEST_DATABASE_URL: postgresql://bunny:bunny@localhost:5432/bunny_test
  BETTER_AUTH_SECRET: ci-only-secret-not-for-production
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bunny
          POSTGRES_PASSWORD: bunny
          POSTGRES_DB: bunny_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bunny -d bunny_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # v5+ can cache automatically off a `packageManager` field, but this
      # package.json has none and the app is nested, so caching stays explicit:
      # the path is repo-relative because `defaults.run.working-directory`
      # applies to run steps, not to actions.
      - uses: actions/setup-node@v7
        with:
          # engines floor is >=22.12; ride the latest 22.x (some transitive
          # deps already want ^22.13, and dev machines run 22.18+).
          node-version: "22"
          cache: npm
          cache-dependency-path: build-bunny/package-lock.json

      - name: Install dependencies
        run: npm ci

      # npm ci already runs `prisma generate` via postinstall; this makes a
      # broken generate fail loudly on its own step instead of inside build.
      - name: Prisma generate
        run: npx prisma generate

      # Tests run against a separate database so migrate/seed state in
      # bunny_dev never leaks into assertions.
      - name: Create test database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE bunny_test;'

      - name: Apply migrations (dev DB)
        run: npx prisma migrate deploy

      - name: Apply migrations (test DB)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Child-facing flows in a real browser (Playwright, Chromium) against a
  # production build: first login, onboarding, first mission, feedback,
  # Arabic RTL — at laptop, tablet-landscape and tablet-portrait sizes.
  e2e:
    runs-on: ubuntu-latest
    needs: ci

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bunny
          POSTGRES_PASSWORD: bunny
          POSTGRES_DB: bunny_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bunny -d bunny_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: build-bunny/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Migrate and seed the demo school (imports + publishes content)
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the app
        # The suite signs in a brand-new child per test from one address;
        # raise only the sign-in ceiling (the limiter itself stays on).
        env:
          AUTH_SIGNIN_RATE_MAX: "1000"
        run: |
          npm run start > next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 2
          done
          cat next.log
          exit 1

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: build-bunny/playwright-report
          retention-days: 7
